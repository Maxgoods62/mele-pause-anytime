name: Bug report
description: Something goes wrong in the game with Pause Anytime installed.
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: The game where it goes wrong. Pause Anytime supports LE1, LE2 and LE3.
      options:
        - LE1 (Mass Effect 1)
        - LE2 (Mass Effect 2)
        - LE3 (Mass Effect 3)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what the game did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game (mission, conversation, cutscene or movie) and the keys or buttons you pressed.
      placeholder: |
        1. Start the conversation with ...
        2. Press Esc
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pause Anytime version
      description: The number in the log line that ends in "LE<n>PauseAnytime N ready".
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Game, other ASIs and mods
      description: >-
        Steam or EA app, and the game version if you know it. The files in `Game\ME<n>\Binaries\Win64\ASI`
        (`LE<n>PauseAnytime.asi` and the others; ME1 for LE1), your other mods, and keyboard or which gamepad.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: >-
        Attach `Logs\PauseAnytime.log` from `<LE folder>\Game\ME<n>\Binaries\Win64` (drag it here).
        Pause Anytime rewrites it each time the game starts, so copy it before you start the game again.
